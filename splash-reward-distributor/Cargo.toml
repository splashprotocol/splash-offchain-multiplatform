[package]
name = "splash-reward-distributor"
version = "1.0.0"
edition = "2021"
rust-version = "1.80.0"

## See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
#[lib]
#name = "splash_reward_distributor"  # Name for `extern crate my_project;`
#path = "src/lib.rs"  # Default, can be omitted if unchanged

# Binary target (main.rs)
[[bin]]
name = "splash-reward-distributor" 

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
async-primitives = { version = "0.1.0", path = "../concurrent-primitives" }
spectrum-streaming = { version = "0.1.0", path = "../spectrum-streaming" }
bloom-offchain = { version = "1.0.0", path = "../bloom-offchain" }
spectrum-offchain = { version = "0.1.0", path = "../spectrum-offchain", features = ["cml-chain"] }
splash-dao-offchain = { version = "1.0.0", path = "../splash-dao-offchain" }
splash-yf-offchain = { version = "1.0.0", path = "../splash-yf-offchain" }
spectrum-offchain-cardano = { version = "1.0.0", path = "../spectrum-offchain-cardano" }
cardano-chain-sync = { version = "0.1.0", path = "../cardano-chain-sync" }
cardano-explorer = { version = "0.1.0", path = "../cardano-explorer" }
spectrum-cardano-lib = { version = "0.1.0", path = "../spectrum-cardano-lib" }
cml-core = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "13c35772222fc46b26177a62726720502bdf21e4" }
cml-crypto = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "13c35772222fc46b26177a62726720502bdf21e4" }
cml-chain = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "13c35772222fc46b26177a62726720502bdf21e4" }
cml-multi-era = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "13c35772222fc46b26177a62726720502bdf21e4" }
const_format = "0.2.34"
futures = "0.3.25"
tokio = { version = "1.22.0", features = ["full"] }
log = "0.4.17"
log4rs = "1.2.0"
async-trait = "0.1.58"
pallas-network = { git = "https://github.com/kettlebell/pallas.git", branch = "conway_update" }
petgraph = { version = "0.8.2", features = ["serde-1"]}
type-equalities = "0.3.1"
serde = { version = "1.0.147", features = ["derive"] }
rmp-serde = "1.3.0"
rocksdb = "0.22.*"
serde_json = "1.0.88"
tracing = "0.1.31"
tracing-subscriber = "0.3.17"
clap = { version = "4.0", features = ["derive"] }
either = "1.9.0"
hex = "0.4.3"
tempfile = "3.10.1"
derive_more = { version = "2.0.1", features = ["full"] }
rand = "0.8.5"

[dev-dependencies]
rocksdb = "0.22.*"
spectrum-offchain-cardano = { version = "1.0.0", path = "../spectrum-offchain-cardano" }
splash-testing = { version = "1.0.0", path = "../splash-testing" }
