[package]
name = "bloom-execution-indexer"
version = "0.1.0"
edition = "2021"
rust-version = "1.84.0"

[dependencies]
actix-cors = "0.7.0"
actix-web = "4.9.0"
async-primitives = { version = "0.1.0", path = "../concurrent-primitives" }
async-trait = "0.1.81"
bloom-offchain-cardano = { version = "1.0.0", path = "../bloom-offchain-cardano" }
cardano-chain-sync = { version = "0.1.0", path = "../cardano-chain-sync" }
clap = { version = "4.5.17", features = ["derive"] }
cml-chain = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "92fa3944388c51880a77209feda35e16e0289247" }
cml-core = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "92fa3944388c51880a77209feda35e16e0289247" }
cml-crypto = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "92fa3944388c51880a77209feda35e16e0289247" }
futures = "0.3.30"
hex = "0.4.3"
log = "0.4.22"
log4rs = "1.3.0"
rmp-serde = "1.3.0"
rocksdb = "0.22.*"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.121"
spectrum-cardano-lib = { version = "0.1.0", path = "../spectrum-cardano-lib" }
spectrum-offchain = { version = "0.1.0", path = "../spectrum-offchain", features = ["cml-chain"] }
spectrum-offchain-cardano = { version = "1.0.0", path = "../spectrum-offchain-cardano" }
spectrum-streaming = { version = "0.1.0", path = "../spectrum-streaming" }
tokio = { version = "1.41.1", features = ["full"] }
tracing = "0.1.31"
tracing-subscriber = "0.3.17"

[dev-dependencies]
tempfile = "3.10.1"
