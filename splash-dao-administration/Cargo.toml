[package]
name = "splash-dao-administration"
version = "0.1.0"
edition = "2021"

[dependencies]
cardano-explorer = { version = "0.1.0", path = "../cardano-explorer" }
clap = { version = "4.0", features = ["derive"] }
cml-core = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "92fa3944388c51880a77209feda35e16e0289247" }
cml-crypto = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "92fa3944388c51880a77209feda35e16e0289247" }
cml-chain = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "92fa3944388c51880a77209feda35e16e0289247" }
cml-multi-era = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "92fa3944388c51880a77209feda35e16e0289247" }
futures-timer = "3.0.2"
num-rational = "0.4.1"
hex = "0.4.3"
rand = "0.8.5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rs_merkle = { git = "https://github.com/kettlebell/rs-merkle", branch = "merkle_tree_serde", features = ["keccak256"]}
spectrum-cardano-lib = { version = "0.1.0", path = "../spectrum-cardano-lib" }
spectrum-offchain = { version = "0.1.0", path = "../spectrum-offchain" }
spectrum-offchain-cardano = { version = "1.0.0", path = "../spectrum-offchain-cardano" }
splash-dao-offchain = { version = "1.0.0", path = "../splash-dao-offchain" }
splash-yf-offchain = { version = "1.0.0", path = "../splash-yf-offchain" }
tokio = { version = "1.42.0", features = ["full"] }
type-equalities = "0.3.1"
serde = { version = "1.0.147", features = ["derive"] }
serde_json = "1.0.88"
uplc = "=1.1.12"
uplc-pallas-codec = { package = "pallas-codec", version = "0.31" }
uplc-pallas-traverse = { package = "pallas-traverse", version = "0.31" }
uplc-pallas-primitives = { package = "pallas-primitives", version = "0.31" }

[features]
default = []
enable_test_30_min_epoch = ["splash-dao-offchain/test_30_min_epoch"]
enable_test_8_hour_epoch = ["splash-dao-offchain/test_8_hour_epoch"]
