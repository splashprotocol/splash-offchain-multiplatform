[package]
name = "cardano-mempool-proxy"
version = "1.0.0"
edition = "2021"
rust-version = "1.84.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.9.0"
actix-cors = "0.7.0"
tokio = "1.41.1"
serde = { version = "1.0.210", features = ["derive"] }
log = "0.4.22"
log4rs = "1.3.0"
serde_json = "1.0.121"
clap = { version = "4.5.17", features = ["derive"] }
derive_more = { version = "1.0.0", features = ["full"] }
pallas-network = { git = "https://github.com/kettlebell/pallas.git", branch = "conway_update" }
cml-crypto = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "13c35772222fc46b26177a62726720502bdf21e4" }
cml-chain = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "13c35772222fc46b26177a62726720502bdf21e4" }
spectrum-offchain = { version = "0.1.0", path = "../spectrum-offchain", features = ["cml-chain"] }
spectrum-cardano-lib = { version = "0.1.0", path = "../spectrum-cardano-lib" }
spectrum-offchain-cardano = { version = "1.0.0", path = "../spectrum-offchain-cardano" }
spectrum-streaming = { version = "0.1.0", path = "../spectrum-streaming" }
cardano-submit-api = { version = "0.1.0", path = "../cardano-submit-api" }
async-stream = "0.3.6"
futures = "0.3.30"