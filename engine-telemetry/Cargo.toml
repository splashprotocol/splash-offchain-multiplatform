[package]
name = "engine-telemetry"
version = "1.0.0"
edition = "2021"
rust-version = "1.84.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = "1.41.1"
async-std = "1.12.0"
serde = { version = "1.0.210", features = ["derive"] }
log = "0.4.22"
serde_json = "1.0.121"
clap = { version = "4.5.17", features = ["derive"] }
cml-crypto = { git = "https://github.com/oskin1/cardano-multiplatform-lib.git", rev = "20d8c963a17098d3448a2b88fbeae4e2b3a3f150" }
bloom-offchain = { version = "1.0.0", path = "../bloom-offchain" }
spectrum-cardano-lib = { version = "0.1.0", path = "../spectrum-cardano-lib" }
spectrum-offchain-cardano = { version = "1.0.0", path = "../spectrum-offchain-cardano" }
spectrum-offchain = { version = "0.1.0", path = "../spectrum-offchain" }
futures = "0.3.30"
tokio-postgres = "0.7.12"
tracing = "0.1.31"
tracing-subscriber = "0.3.17"
log4rs = "1.2.0"
bigdecimal = "0.4.3"
pg_bigdecimal = "0.1.5"